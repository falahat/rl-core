[workspace]
resolver = "2"
members = [
    "crates/engine/determinism",
    "crates/engine/action_id",
    "crates/engine/rl_core",
    "crates/engine/playground",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Arian"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy_ecs = "=0.14.2"
# Inter-crate path deps. `rl_core` keeps `default-features = false` (its `bevy`
# feature is opt-in; consumers that want the `Component` derives on `Observation`
# / traces add `features = ["bevy"]`).
determinism = { path = "crates/engine/determinism" }
action_id = { path = "crates/engine/action_id" }
rl_core = { path = "crates/engine/rl_core", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release-wasm]
inherits = "release"
opt-level = "s"
lto       = "fat"
panic     = "abort"
strip     = true
